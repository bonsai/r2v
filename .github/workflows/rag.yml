name: Build and publish R2V paper RAG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rag/**"
      - "site/**"
      - "papers.yaml"
      - "docs/ai-anime-production/**"
      - ".github/workflows/rag.yml"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: r2v-rag-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Download papers and build full-text index
        run: python rag/r2v_rag.py ingest --download

      - name: Build project knowledge RAG2 database
        run: |
          python rag/build_rag2.py
          test -s rag/data/rag2.db

      - name: Smoke-test paper retrieval
        run: |
          python rag/r2v_rag.py ask "reference identity consistency evaluation" --limit 6 | tee rag-smoke-test.txt
          test -s rag-smoke-test.txt
          grep -q "arXiv:" rag-smoke-test.txt

      - name: Smoke-test project RAG2 database
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("rag/data/rag2.db")
          docs = db.execute("SELECT count(*) FROM documents").fetchone()[0]
          chunks = db.execute("SELECT count(*) FROM chunks").fetchone()[0]
          assert docs > 0 and chunks > 0, (docs, chunks)
          hits = db.execute(
              "SELECT title FROM chunks_fts WHERE chunks_fts MATCH ? LIMIT 5",
              ("JEV OR TPS OR R2V",)
          ).fetchall()
          assert hits, "RAG2 FTS smoke test returned no hits"
          print(f"RAG2 OK: {docs} documents, {chunks} chunks")
          db.close()
          PY

      - name: Prepare GitHub Pages site
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p site/data
          cp rag/data/r2v_rag.sqlite3 site/data/r2v_rag.sqlite3
          cp rag/data/rag2.db site/data/rag2.db
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          payload = {
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "commit": os.environ["COMMIT_SHA"][:7],
              "papers": 3,
              "databases": ["r2v_rag.sqlite3", "rag2.db"],
              "rag2_scope": "papers.yaml metadata and project research documents; not full paper PDF text"
          }
          Path("site/data/build-info.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
          test -s site/index.html
          test -s site/data/r2v_rag.sqlite3
          test -s site/data/rag2.db

      - name: Upload RAG database artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r2v-rag-index-${{ github.run_id }}
          path: |
            rag/data/r2v_rag.sqlite3
            rag/data/rag2.db
            rag-smoke-test.txt
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
