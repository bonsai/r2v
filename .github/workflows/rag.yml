name: Build R2V paper RAG index

on:
  workflow_dispatch:
  push:
    paths:
      - "rag/**"
      - ".github/workflows/rag.yml"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: r2v-rag-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Download papers and build full-text index
        run: python rag/r2v_rag.py ingest --download

      - name: Smoke-test retrieval
        run: |
          python rag/r2v_rag.py ask "reference identity consistency evaluation" --limit 6 | tee rag-smoke-test.txt
          test -s rag-smoke-test.txt
          grep -q "arXiv:" rag-smoke-test.txt

      - name: Upload generated index and smoke-test output
        uses: actions/upload-artifact@v4
        with:
          name: r2v-rag-index-${{ github.run_id }}
          path: |
            rag/data/r2v_rag.sqlite3
            rag-smoke-test.txt
          if-no-files-found: error
          retention-days: 14
