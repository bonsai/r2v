name: Build R2V ontology graph and PlantUML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ontology.yml"
      - "rag2ontology.yml"
      - "ontology2graph.yml"
      - "graph2puml.yml"
      - "instances/**"
      - "scripts/ontology2graph.py"
      - "scripts/graph2puml.py"
      - ".github/workflows/graph.yml"

permissions:
  contents: read

concurrency:
  group: r2v-graph-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r rag/requirements.txt

      - name: Validate YAML specifications
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ("ontology.yml", "rag2ontology.yml", "ontology2graph.yml", "graph2puml.yml"):
              with Path(name).open(encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"OK {name}")
          PY

      - name: Build graph YAML
        run: python scripts/ontology2graph.py

      - name: Build PlantUML
        run: python scripts/graph2puml.py

      - name: Upload graph and diagrams
        uses: actions/upload-artifact@v4
        with:
          name: r2v-graph-and-puml-${{ github.run_id }}
          path: |
            graph/r2v.graph.yml
            graph/unresolved-references.yml
            diagrams/r2v.puml
            diagrams/unrendered-edges.txt
          if-no-files-found: warn
          retention-days: 14
